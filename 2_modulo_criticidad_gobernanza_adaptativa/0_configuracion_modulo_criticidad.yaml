# Configuración módulo criticidad — PASO 2 entregable parcial3
# Semilla reproducible y rutas relativas a esta carpeta.

seed: 42
n_eval: 400
top_k: 5

# Decisiones confirmadas D1–D5
decisiones:
  D1_dual_gate: true          # Gate A pre-LLM + Gate B post-agente
  D2_rag_plugin_obligatorio_var2: true
  D3_calibrar_gold_v2: true   # subconjunto si existe
  D4_hitl_async_simulado_csv: true
  D5_carpeta2_antes_paso3: true

# Rutas upstream (relativas a esta carpeta)
paths:
  eval: ../0_etl_ingesta_preprocesamiento/8_conjunto_evaluacion_experimento_n400.csv
  rag_hibrido: ../1_ingenieria_atributos_y_recuperacion_rag/7_tabla_recuperacion_hibrida_rrf_top5.csv
  rag_fallback: ../1_ingenieria_atributos_y_recuperacion_rag/3_tabla_vecinos_recuperados_top5.csv
  features_preview: ../1_ingenieria_atributos_y_recuperacion_rag/5_tabla_features_middleware_preview.csv
  anti_fuga: ../1_ingenieria_atributos_y_recuperacion_rag/4_informe_auditoria_anti_fuga.json
  winning_config: ../../../../docs/experiments/sprint7_hpo_random_bayes_criticidad_uni_n40/winning_config.json
  gold_v2: ../../../data/criticidad_cases/casos_gold_criticidad_v2.jsonl

# Política criticidad (HPO sprint7 — fallback si no existe winning_config)
policy:
  mode: stop_heavy
  weights:
    base: 0.286902432989298
    risk: 0.23052429958817053
    p_stop: 0.10332395538353709
    uncertainty: 0.1422249502458552
    rag_gap: 0.052460633052286126
    fuzzy_stop: 0.18456372874085303
  threshold_stop: 0.64
  threshold_pausa: 0.2
  risk_stop_floor: 0.4
  p_stop_floor: 0.52
  stop_cost_threshold: 0.46
  pause_uncertainty: 0.38

# Matriz de costos Elkan (EC / C-04)
cost_matrix:
  pause_hitl: 0.08
  stop_hitl: 0.18
  false_negative_stop: 1.0

# HITL — modos por decisión
hitl:
  play: auto
  pausa: async   # cola simulada en CSV (D4)
  stop: sync     # bloqueo pre-acción

# Métricas Capa A reportadas en artefacto 6_
metricas_capa_a:
  - C-01  # F1-macro
  - C-02  # F1-stop
  - C-03  # ECE
  - C-04  # EC (ex-CEPA)
  - C-05  # FNR-stop
  - C-06  # Override rate (Gate B)
